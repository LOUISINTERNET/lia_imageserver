# Configuration/Services.yaml
services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  LIA\LiaImageserver\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  LIA\LiaImageserver\Service\ImageService:
    public: true

  # Override Extbase ImageService with LIA implementation
  TYPO3\CMS\Extbase\Service\ImageService:
    class: LIA\LiaImageserver\Service\ImageService
